<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laboratorio XR</title>

    <!-- Librería A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- ================================= -->
        <!-- MODELO CAD / MODELO GLB -->
        <!-- ================================= -->

        <a-assets>

<a-asset-item
    id="modeloIndustrial"
    src="modelo-optimized.glb">
</a-asset-item>

        </a-assets>


        <!-- ================================= -->
        <!-- MODELO INDUSTRIAL -->
        <!-- ================================= -->

        <!--
        Se baja el modelo en el eje Y
        para corregir la posición del CAD.
        -->

        <a-entity
            gltf-model="#modeloIndustrial"
            position="0 -8 -5">
        </a-entity>


        <!-- ================================= -->
        <!-- PRIMITIVAS A-FRAME -->
        <!-- ================================= -->

        <!-- ESTRUCTURA -->
        <a-box
            position="0 2 -3"
            scale="6 0.2 0.2"
            color="#444444">
        </a-box>


        <!-- COLUMNA -->
        <a-box
            position="-3 1 -3"
            scale="0.2 2 0.2"
            color="#444444">
        </a-box>


        <!-- SENSOR -->
        <a-sphere
            position="2 2 -3"
            radius="0.3"
            color="red">
        </a-sphere>


        <!-- EJE -->
        <a-cylinder
            position="0 0.5 -3"
            radius="0.3"
            height="2"
            color="yellow">
        </a-cylinder>


        <!-- ================================= -->
        <!-- PISO -->
        <!-- ================================= -->

        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="20"
            height="20"
            color="#555555">
        </a-plane>


        <!-- ================================= -->
        <!-- ILUMINACIÓN -->
        <!-- ================================= -->

        <a-light
            type="ambient"
            intensity="1.5">
        </a-light>

        <a-light
            type="directional"
            position="2 5 3"
            intensity="2">
        </a-light>


        <!-- ================================= -->
        <!-- CIELO -->
        <!-- ================================= -->

        <a-sky
            color="#87CEEB">
        </a-sky>


        <!-- ================================= -->
        <!-- CÁMARA -->
        <!-- ================================= -->

        <a-camera
            position="0 3 3"
            rotation="-10 0 0">
        </a-camera>

    </a-scene>

</body>

</html>
